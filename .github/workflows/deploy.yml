name: Pipeline SSDLC - CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy via SSH to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo apt update -y
            sudo apt install -y docker.io
            sudo usermod -aG docker ubuntu
            if [ ! -d "app" ]; then
              git clone https://github.com/SilvaGabriela20/Auditoria-e-Seguran-a-de-Sistemas---SSDLC.git app
            fi
            cd app
            git pull origin main
            sudo docker stop minha-app || true
            sudo docker rm minha-app || true
            sudo docker build -t minha-app .
            sudo docker run -d -p 80:80 --name minha-app minha-app
