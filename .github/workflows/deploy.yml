name: Pipeline SSDLC - CI/CD

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  sonarcloud:
    name: SonarCloud Scan (SAST)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=silvagabriela20
            -Dsonar.projectKey=SilvaGabriela20_Auditoria-e-Seguran-a-de-Sistemas---SSDLC
            -Dsonar.sources=.

  deploy:
    name: Deploy to AWS EC2
    needs: sonarcloud
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy via SSH to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo apt update -y
            sudo apt install -y docker.io
            sudo usermod -aG docker ubuntu
            if [ ! -d "app" ]; then
              git clone https://github.com/SilvaGabriela20/Auditoria-e-Seguran-a-de-Sistemas---SSDLC.git app
            fi
            cd app
            git pull origin main
            sudo docker stop minha-app || true
            sudo docker rm minha-app || true
            sudo docker build -t minha-app .
            sudo docker run -d -p 80:80 --name minha-app minha-app
